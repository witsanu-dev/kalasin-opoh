version: '3.8'

services:
  opoh-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: opoh-kalasin:latest
    container_name: opoh_web
    restart: always
    ports:
      - "${APP_PORT:-46}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_HOSPITAL_NAME=${NEXT_PUBLIC_HOSPITAL_NAME:-KALASIN}
      - NEXT_PUBLIC_HOSPITAL_CODE=${NEXT_PUBLIC_HOSPITAL_CODE}
      - NEXT_PUBLIC_HOSPITAL_FULL_NAME=${NEXT_PUBLIC_HOSPITAL_FULL_NAME}
      - API_KEY=${API_KEY}
      - HOSXP_DB_HOST=${HOSXP_DB_HOST}
      - HOSXP_DB_PORT=${HOSXP_DB_PORT:-3306}
      - HOSXP_DB_USER=${HOSXP_DB_USER}
      - HOSXP_DB_PASSWORD=${HOSXP_DB_PASSWORD}
      - HOSXP_DB_NAME=${HOSXP_DB_NAME:-hos}
      - LOCAL_DB_HOST=${LOCAL_DB_HOST:-opoh-db}
      - LOCAL_DB_PORT=${LOCAL_DB_PORT:-3306}
      - LOCAL_DB_USER=${LOCAL_DB_USER:-opoh_user}
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD:-opoh_secure_password}
      - LOCAL_DB_NAME=${LOCAL_DB_NAME:-db_opoh}
    depends_on:
      opoh-db:
        condition: service_healthy
    networks:
      - opoh_network
    volumes:
      - ./.env:/app/.env

  opoh-db:
    image: mariadb:10.11
    container_name: opoh_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-opoh_root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-db_opoh}
      - MYSQL_USER=${MYSQL_USER:-opoh_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-opoh_secure_password}
    volumes:
      - opoh_mysql_data:/var/lib/mysql
      - ./database/db_opoh.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opoh_network

volumes:
  opoh_mysql_data:

networks:
  opoh_network:
    driver: bridge
